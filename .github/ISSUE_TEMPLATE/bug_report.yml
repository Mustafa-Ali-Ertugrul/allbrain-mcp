name: Bug report
description: Something in AllBrain is broken or behaves unexpectedly.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please fill in as much as you can —
        reproducible reports get fixed fastest.
  - type: input
    id: version
    attributes:
      label: AllBrain version
      description: Output of `uvx allbrain-agent-runtime --version` or the version in `pyproject.toml`.
      placeholder: "1.1.1"
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: "Codex CLI / OpenCode / Claude Code / other"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.13.1"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 / macOS 15 / Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you actually saw.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: The smallest sequence of commands or tool calls that triggers it.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: |
        Paste any error output or stack trace.

        **This issue is public.** Anything pasted here — including logs — is visible to everyone and indexed by search engines. Redact secrets, tokens, file paths, hostnames, and private event payloads before posting. See [SECURITY.md](https://github.com/Mustafa-Ali-Ertugrul/allbrain-mcp/security/policy) for how to report vulnerabilities privately.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I reproduced this on the latest release.
          required: true