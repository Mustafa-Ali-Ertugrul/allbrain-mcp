name: Nightly Stress

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

env:
  UV_VERSION: "0.6.x"
  PYTHON_VERSION: "3.13"
  # Hosted-runner tail latency fluctuates: p50 swings 0.19–0.28s run-to-run
  # on the same commit. Nightlies #25-#29 repeatedly breach a 0.500s p95 gate
  # (max observed p95=0.6104s) while data integrity stays perfect (2000/2000
  # OK, 0 locks, deterministic match). Raise the p95 budget to 0.700s to
  # keep margin for GHA tail variance without weakening the correctness gate.
  MCP_STRESS_P95_BUDGET_SECONDS: "0.700"

jobs:
  stress-a:
    name: Stress A — Concurrent DB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run python scripts/stress_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-report-a
          path: scripts/stress_report.json

  stress-b:
    name: Stress B — MCP Protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run python scripts/mcp_stress_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-report-b
          path: scripts/mcp_stress_report.json
